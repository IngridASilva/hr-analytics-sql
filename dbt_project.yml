name: hr_analytics
version: "1.0.0"
config-version: 2
profile: hr_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Competência de corte da análise. Fora do SQL de propósito: mudar o
  # recorte não pode exigir editar modelo.
  data_corte: "2025-12-01"
  # Janela usada nas métricas móveis de turnover.
  janela_turnover_meses: 12

models:
  hr_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      rh:
        +schema: rh
      financeiro:
        +schema: financeiro
